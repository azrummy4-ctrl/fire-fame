name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install packages
        run: bun install

      # APK live website (server.url) kholta hai, isliye sirf ek chhota
      # placeholder page chahiye taaki Capacitor sync chal sake.
      - name: Prepare web folder
        run: |
          mkdir -p dist/client
          echo '<!doctype html><html><head><meta http-equiv="refresh" content="0;url=https://fire-fame.lovable.app"></head><body></body></html>' > dist/client/index.html

      - name: Capacitor sync
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FireZone-APK
          path: android/app/build/outputs/apk/debug/*.apk
